<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1822"><title>Earthtrip · 오프라인</title><style>body{background:#0b1822;color:#ecf4e5;font:16px/1.8 system-ui,sans-serif;min-height:90vh;display:grid;place-items:center;margin:0}main{text-align:center;padding:30px;max-width:420px}img{width:76px;border-radius:20px}h1{font-size:25px}p{color:#a1b6aa}a{display:inline-block;padding:10px 24px;background:#c2e59c;color:#17352c;border-radius:9px;text-decoration:none}button{position:absolute;top:20px;right:20px;color:#c2e59c;background:none;border:1px solid #40594e;border-radius:8px;padding:8px 12px}</style></head><body><button id="language">English</button><main><img src="./icon.svg" alt="Earthtrip"><h1 id="title">잠시 연결이 끊겼어요</h1><p id="description">지구 지도, 실시간 방송, 현재 날씨를 보려면 인터넷에 연결해 주세요.</p><a href="./" id="retry">다시 연결</a></main><script>let language='ko';try{language=localStorage.getItem('earthtrip-language')||'ko'}catch{}function render(){const english=language==='en';document.documentElement.lang=language;document.getElementById('title').textContent=english?'You are offline':'잠시 연결이 끊겼어요';document.getElementById('description').textContent=english?'Connect to the internet to explore the globe, live streams and current weather.':'지구 지도, 실시간 방송, 현재 날씨를 보려면 인터넷에 연결해 주세요.';document.getElementById('retry').textContent=english?'Reconnect':'다시 연결';document.getElementById('language').textContent=english?'한국어':'English'}document.getElementById('language').onclick=()=>{language=language==='ko'?'en':'ko';render()};render()</script></body></html>
